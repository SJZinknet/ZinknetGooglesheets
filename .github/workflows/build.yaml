name: Build site from Google Sheet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generator/**"
      - "assets_src/**"
      - ".github/workflows/build.yaml"

permissions:
  contents: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Build static site
        run: |
          python generator/build.py

      - name: Verify generated site
        run: |
          test -f docs/index.html
          test -f docs/style.css
          test -f docs/.nojekyll
          grep -n "style.css?v=" docs/index.html | head

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "No generated docs changes to commit."
          else
            git commit -m "Build site from Google Sheet"
            git push
          fi
